apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-lan-config
  namespace: dns
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        
        # --- TUS DOMINIOS HOMELAB ---
        # El DNS (.209) le dice a tu PC que las webs están en la .210
        hosts {
           192.168.18.210 jellyfin.lan qbittorrent.lan jellyseerr.lan radarr.lan sonarr.lan lidarr.lan prowlarr.lan bazarr.lan readarr.lan filebrowser.lan rdt.lan
           fallthrough
        }
        
        # Reenvío a Internet (Cloudflare/Google)
        forward . 1.1.1.1 8.8.8.8
        
        cache 30
        loop
        reload
        loadbalance
    }
