apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-lan-config
  namespace: dns
data:
  Corefile: |
    .:53 {
        log
        errors
        # Mapeo de tus dominios locales a la IP del Ingress
        hosts {
            192.168.18.210 jellyfin.lan # <--- PON AQUÍ LA IP DE TU INGRESS
            192.168.18.210 qbittorrent.lan # <--- LA MISMA IP
            
            fallthrough
        }
        forward . 1.1.1.1 8.8.8.8
        cache 30
    }
