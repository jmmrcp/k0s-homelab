apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-ingress
  namespace: downloads
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
  # Regla 1: Para PC/Móvil (Mantenemos el dominio bonito)
  - host: jellyfin.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin-lb
            port:
              number: 80

  # Regla 2: "Catch-all" para la IP (TV)
  # ELIMINAMOS LA LÍNEA "host: ..."
  - http: 
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin-lb
            port:
              number: 80