apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: downloads
  labels:
    app: filebrowser
spec:
  replicas: 1
  # Strategy Recreate: Evita bloqueos en la base de datos .db si actualizas
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:latest
        imagePullPolicy: IfNotPresent
        
        args:
        - "--root=/srv"
        - "--address=0.0.0.0"
        - "--port=8080"
        - "--noauth" # ⚠️ OJO: Cualquiera en tu red podrá ver/borrar archivos sin contraseña
        - "--database=/config/filebrowser.db" # Forzamos la ubicación de la DB
        
        envFrom:
        - configMapRef:
            name: common-env
            
        ports:
        - containerPort: 8080
          name: http
          
        # --- MEJORA: Health Check HTTP ---
        # TCP solo mira el puerto. HTTP verifica que la app sirva la web.
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            # Filebrowser puede subir un poco si mueves archivos grandes o generas zip
            memory: 512Mi 
            
        volumeMounts:
        - name: data
          mountPath: /srv
        - name: config
          mountPath: /config
          
      volumes:
      - name: data
        persistentVolumeClaim:
          # Usamos el mismo PVC que qBittorrent para ver las descargas
          claimName: qbit-downloads 
      - name: config
        persistentVolumeClaim:
          # --- CAMBIO IMPORTANTE ---
          # Usamos un PVC real en lugar de emptyDir para no perder configuración
          claimName: filebrowser-config
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
