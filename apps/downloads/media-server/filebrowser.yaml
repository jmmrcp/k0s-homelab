apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: downloads
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:latest
        
        args:
        - "--root=/srv"
        - "--address=0.0.0.0"
        - "--port=8080"      # <--- NUEVO: Usar puerto no privilegiado
        - "--noauth"         # Opcional: Quita esto si quieres login
        
        envFrom:
        - configMapRef:
            name: common-env
            
        ports:
        - containerPort: 8080 # <--- CAMBIO: 80 -> 8080
          name: http
          
        # Control de Salud (Actualizado al nuevo puerto)
        livenessProbe:
          tcpSocket:
            port: 8080        # <--- CAMBIO
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080        # <--- CAMBIO
          initialDelaySeconds: 5
          periodSeconds: 10
          
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            
        volumeMounts:
        - name: data
          mountPath: /srv
        - name: config
          mountPath: /config
          
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: qbit-downloads
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: filebrowser
  ports:
    - port: 80           # El puerto EXTERNO sigue siendo 80 (para no romper enlaces)
      targetPort: 8080   # El puerto INTERNO ahora es 8080
      protocol: TCP