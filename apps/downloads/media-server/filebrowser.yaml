apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: downloads
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      # Seguridad a nivel de Pod
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:latest
        
        # Argumentos de inicio corregidos
        args:
        - "--root=/srv"      # La carpeta que verás en la web
        - "--address=0.0.0.0" # Escuchar en todas las interfaces
        - "--noauth"         # Sin login (confiamos en la seguridad de Tailscale/Ingress)
        # Si quieres usuario/contraseña, borra la línea de "--noauth"
        
        # Variables comunes
        envFrom:
        - configMapRef:
            name: common-env
            
        ports:
        - containerPort: 80
          name: http
          
        # Control de Salud
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          
        # Límites de Recursos (Es muy ligero)
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            
        volumeMounts:
        - name: data
          mountPath: /srv # Aquí se monta tu disco de películas
        - name: config
          mountPath: /config # Aquí se guarda la DB temporal
          
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: qbit-downloads
      - name: config
        emptyDir: {} # Configuración volátil para evitar corrupción de DB
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser-lb # Mantenemos el nombre antiguo para no romper enlaces DNS
  namespace: downloads
spec:
  type: ClusterIP # Solo accesible internamente
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP