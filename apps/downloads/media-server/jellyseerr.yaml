apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: downloads
  labels:
    app: jellyseerr
spec:
  replicas: 1
  # CRÍTICO: Recreate evita corrupción de la DB SQLite y bloqueos de archivos.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      # Seguridad a nivel de Pod (Correcto para LinuxServer/Fallenbagel)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: jellyseerr
        image: fallenbagel/jellyseerr:latest
        imagePullPolicy: IfNotPresent
        
        envFrom:
        - configMapRef:
            name: common-env
        
        env:
        - name: LOG_LEVEL
          value: "info"
        
        ports:
        - containerPort: 5055
          name: http
        
        # --- MONITORIZACIÓN MEJORADA (HTTP) ---
        # Jellyseerr responde en la raíz '/'. TCP solo comprueba el puerto.
        livenessProbe:
          httpGet:
            path: /
            port: 5055
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /
            port: 5055
          initialDelaySeconds: 15
          periodSeconds: 10

        # StartupProbe: Node.js a veces tarda un poco en compilar/iniciar tras un update
        startupProbe:
          httpGet:
            path: /
            port: 5055
          failureThreshold: 30
          periodSeconds: 5
        
        # --- OPTIMIZACIÓN DE RECURSOS ---
        # Node.js es "perezoso" con la RAM. Si le das 1GB, usará 1GB.
        # 512Mi es suficiente para una instancia doméstica.
        resources:
          requests:
            cpu: 10m
            memory: 150Mi
          limits:
            cpu: 1000m
            memory: 512Mi # Bajado de 1Gi. Ahorro: 512MB.
            
        volumeMounts:
        - name: config
          mountPath: /app/config
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: jellyseerr
  ports:
    - port: 80
      targetPort: 5055
      protocol: TCP
