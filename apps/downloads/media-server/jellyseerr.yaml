apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: downloads
  labels:
    app: jellyseerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      # Seguridad a nivel de Pod
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: jellyseerr
        image: fallenbagel/jellyseerr:latest
        
        # Variables de entorno (Timezone, PUIDs) desde el ConfigMap común
        envFrom:
        - configMapRef:
            name: common-env
        
        # Variables específicas
        env:
        - name: LOG_LEVEL
          value: "info"
        
        ports:
        - containerPort: 5055
          name: http
        
        # Control de Salud
        livenessProbe:
          tcpSocket:
            port: 5055
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5055
          initialDelaySeconds: 15
          periodSeconds: 10
        
        # Límites de Recursos (NodeJS puede ser tragón, lo limitamos)
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
            
        volumeMounts:
        - name: config
          mountPath: /app/config
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr-lb # Mantenemos el nombre "-lb" para no romper el Ingress existente
  namespace: downloads
spec:
  type: ClusterIP # Solo accesible desde dentro (Ingress/Cloudflare)
  selector:
    app: jellyseerr
  ports:
    - port: 80
      targetPort: 5055
      protocol: TCP