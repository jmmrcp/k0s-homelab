# --- 1. ALMACENAMIENTO (Caché) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stremio-cache
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# --- 2. DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio
  namespace: downloads
  labels:
    app: stremio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stremio
  template:
    metadata:
      labels:
        app: stremio
    spec:
      containers:
      - name: stremio-server
        image: stremio/server:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 11470
          name: server
        
        env:
        - name: NO_CORS
          value: "1" # Vital para que la TV conecte
          
        volumeMounts:
        - name: cache
          mountPath: /root/.stremio-server
          
        # Probes de salud
        livenessProbe:
          httpGet:
            path: /
            port: 11470
          initialDelaySeconds: 15
          periodSeconds: 20
        
        readinessProbe:
          httpGet:
            path: /
            port: 11470
          initialDelaySeconds: 10
          periodSeconds: 10

        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            memory: "1Gi"

      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: stremio-cache
---
# --- 3. SERVICIO (METAL-LB) ---
apiVersion: v1
kind: Service
metadata:
  name: stremio
  namespace: downloads
spec:
  type: LoadBalancer
  
  # --- CAMBIO IMPORTANTE ---
  # Asignamos una IP fija dentro de tu rango (192.168.18.200-220)
  loadBalancerIP: 192.168.18.205
  
  externalTrafficPolicy: Local
  selector:
    app: stremio
  ports:
    - name: server
      port: 11470
      targetPort: 11470
      protocol: TCP
    # Puerto 80 opcional para facilitar escritura en TV
    - name: http
      port: 80
      targetPort: 11470
      protocol: TCP

---
# --- 4. INGRESS (Opcional para PC/Móvil) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stremio-ingress
  namespace: downloads
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: stremio.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: server
