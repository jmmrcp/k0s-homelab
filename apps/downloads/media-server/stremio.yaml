apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stremio-cache
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi # Espacio para el buffer de descarga
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate # Importante para no corromper la caché
  selector:
    matchLabels:
      app: stremio
  template:
    metadata:
      labels:
        app: stremio
    spec:
      containers:
      # --- CONTENEDOR 1: INTERFAZ WEB ---
      - name: stremio-web
        image: stremio/stremio-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: web
        env:
        - name: NO_CORS
          value: "1"
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            memory: "256Mi"

      # --- CONTENEDOR 2: STREAMING SERVER ---
      - name: stremio-server
        image: stremio/server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11470
          name: server
        env:
        - name: NO_CORS
          value: "1"
        volumeMounts:
        - name: cache
          mountPath: /root/.stremio-server
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            memory: "1Gi" # Le damos RAM para manejar el buffer
      
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: stremio-cache
---
apiVersion: v1
kind: Service
metadata:
  name: stremio
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: stremio
  ports:
    - name: web
      port: 80
      targetPort: 8080
    - name: server
      port: 11470
      targetPort: 11470
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stremio-ingress
  namespace: downloads
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Necesario para que el servidor de streaming funcione tras el proxy
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Access-Control-Allow-Origin: *";
spec:
  ingressClassName: nginx
  rules:
  # Regla 1: Dominio Local (PC/Móvil)
  - host: stremio.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: web
      # Ruta especial para conectar al servidor de streaming
      - path: /server/
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: server

  # Regla 2: Acceso por IP (Para que funcione en la TV si usas navegador)
  # Nota: Stremio tiene app nativa en Android TV, pero esto sirve para el navegador.
  - http:
      paths:
      - path: /stremio
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: web