# --- 1. ALMACENAMIENTO (Caché) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stremio-cache
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# --- 2. DEPLOYMENT (Solo Server) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio
  namespace: downloads
  labels:
    app: stremio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stremio
  template:
    metadata:
      labels:
        app: stremio
    spec:
      containers:
      # He borrado el contenedor "web" porque la imagen no existe.
      # Dejamos solo el servidor:
      - name: stremio-server
        image: stremio/server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11470
          name: server
        env:
        - name: NO_CORS
          value: "1"
        volumeMounts:
        - name: cache
          mountPath: /root/.stremio-server
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            memory: "2Gi"
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: stremio-cache
---
# --- 3. SERVICIO ---
apiVersion: v1
kind: Service
metadata:
  name: stremio
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: stremio
  ports:
    - name: server
      port: 11470
      targetPort: 11470
---
# --- 4. INGRESS ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stremio-ingress
  namespace: downloads
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Access-Control-Allow-Origin: *";
spec:
  ingressClassName: nginx
  rules:
  # Regla: stremio.lan
  - host: stremio.lan
    http:
      paths:
      # Todo el tráfico va al servidor directamente
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: server

  # Regla IP (Para TV)
  - http:
      paths:
      - path: /stremio
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: server