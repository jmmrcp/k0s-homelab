# --- 1. ALMACENAMIENTO (Caché) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stremio-cache
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# --- 2. DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio
  namespace: downloads
  labels:
    app: stremio
spec:
  replicas: 1
  # Recreate es correcto aquí para limpiar el volumen de caché si se reinicia
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stremio
  template:
    metadata:
      labels:
        app: stremio
    spec:
      containers:
      - name: stremio-server
        image: stremio/server:latest
        imagePullPolicy: Always # Recomendado con 'latest' para bajar actualizaciones al reiniciar
        
        ports:
        - containerPort: 11470
          name: server
          
        env:
        - name: NO_CORS
          value: "1" # Vital para que funcione desde clientes web/TV
          
        volumeMounts:
        - name: cache
          mountPath: /root/.stremio-server
          
        # --- MONITORIZACIÓN DE SALUD ---
        livenessProbe:
          httpGet:
            path: /
            port: 11470
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 11470
          initialDelaySeconds: 10
          periodSeconds: 10

        # --- RECURSOS ---
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            # Stremio Server es ligero (es un relay). 1Gi es un techo seguro.
            memory: "1Gi" 

      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: stremio-cache
---
# --- 3. SERVICIO ---
apiVersion: v1
kind: Service
metadata:
  name: stremio
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: stremio
  ports:
    - name: server
      port: 11470
      targetPort: 11470
      protocol: TCP
---
# --- 4. INGRESS ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stremio-ingress
  namespace: downloads
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # CORS para permitir acceso desde la app web oficial
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    
    # ⚠️ OJO: Si la ruta /stremio falla en la TV, descomenta la siguiente línea:
    # nginx.ingress.kubernetes.io/rewrite-target: /$2
    
spec:
  ingressClassName: nginx
  rules:
  # Opción A: Subdominio (La más robusta)
  - host: stremio.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              name: server

  # Opción B: Acceso por IP/Ruta (Para TV)
  # Nota: Si tu TV soporta mDNS o DNS local, usa stremio.lan mejor.
  - http:
      paths:
      - path: /stremio(/|$)(.*) # Regex para capturar todo lo que venga después
        pathType: ImplementationSpecific
        backend:
          service:
            name: stremio
            port:
              name: server
