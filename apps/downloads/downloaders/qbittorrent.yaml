apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-downloads
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual # Apunta al PV físico
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        envFrom:
        - configMapRef:
            name: common-env
        env:
        - name: WEBUI_PORT
          value: "8080"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"   # Límite para proteger el nodo
            cpu: "2000m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbit-config
      - name: downloads
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - port: 80
      targetPort: 8080
