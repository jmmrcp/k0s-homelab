apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: downloads
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      # --- SEGURIDAD POD ---
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true

      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        
        # --- SEGURIDAD CONTENEDOR ---
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        # --- ENTORNO ---
        envFrom:
        - configMapRef:
            name: common-env # Carga PUID, PGID y TZ

        # --- PUERTOS ---
        ports:
        - containerPort: 8989
          name: http

        # --- CONTROL DE SALUD ---
        livenessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 15
          periodSeconds: 10

        # --- RECURSOS ---
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1.5Gi # Sonarr necesita margen para tareas programadas

        # --- DISCOS ---
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data # Vital que sea /data para compartir con qBit
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-lb # Mantenemos el nombre para compatibilidad con Ingress
  namespace: downloads
spec:
  type: ClusterIP # Solo accesible internamente
  selector:
    app: sonarr
  ports:
    - port: 80
      targetPort: 8989
      protocol: TCP