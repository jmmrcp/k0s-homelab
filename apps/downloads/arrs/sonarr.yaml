apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: downloads
  labels:
    app: sonarr
spec:
  replicas: 1
  # CRÍTICO: Recreate evita que dos pods de Sonarr corran a la vez durante updates.
  # Si no lo pones, la base de datos SQLite se bloquea y corrompe.
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        # RECOMENDACIÓN: Intenta no usar 'latest' en producción, mejor fija una versión (ej: :version-4.0.0)
        image: lscr.io/linuxserver/sonarr:latest
        imagePullPolicy: IfNotPresent
        
        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 8989
          name: http

        # --- MEJORA DE PROBES ---
        # Usar HTTP en lugar de TCP garantiza que la APP funciona, no solo que el puerto abre.
        livenessProbe:
          httpGet:
            path: /ping
            port: 8989
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /ping
            port: 8989
          initialDelaySeconds: 15
          periodSeconds: 10
          
        # StartupProbe da tiempo extra SOLO al arrancar (útil si hay migraciones de DB)
        startupProbe:
          httpGet:
            path: /ping
            port: 8989
          failureThreshold: 30
          periodSeconds: 10

        # --- MEJORA DE RECURSOS ---
        # Ajustado para ahorrar RAM según tu petición anterior.
        resources:
          requests:
            cpu: 20m
            memory: 150Mi # Garantizamos lo mínimo necesario
          limits:
            cpu: 1000m
            memory: 512Mi # Bajado de 1.5Gi a 512Mi (suficiente y ahorra 1GB)

        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data 
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: sonarr
  ports:
    - port: 80
      targetPort: 8989
      protocol: TCP
