apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: downloads
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      # SIN securityContext a nivel de Pod (s6-overlay requiere root al inicio)

      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        
        # SIN securityContext a nivel de Contenedor

        # Carga PUID=1000, PGID=1000, TZ desde tu configuración común
        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 8989
          name: http

        # Control de salud
        livenessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 15
          periodSeconds: 10

        # Límites de recursos (Sonarr necesita más RAM que los otros)
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1.5Gi

        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data # Vital para Hardlinks
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-lb
  namespace: downloads
spec:
  type: ClusterIP # Solo interno
  selector:
    app: sonarr
  ports:
    - port: 80
      targetPort: 8989
      protocol: TCP