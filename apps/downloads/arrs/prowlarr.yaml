apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # SIN securityContext a nivel de Pod (s6-overlay requiere root al inicio)

      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        
        # SIN securityContext a nivel de Contenedor

        # Carga PUID=1000, PGID=1000, TZ desde tu configuración común
        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 9696
          name: http

        # Control de salud
        livenessProbe:
          tcpSocket:
            port: 9696
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 9696
          initialDelaySeconds: 15
          periodSeconds: 10

        # Límites de recursos (Prowlarr es muy ligero)
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        volumeMounts:
        - name: config
          mountPath: /config
        # Montamos /data aunque Prowlarr no mueva archivos, para mantener consistencia
        # y por si usas "Blackhole" como cliente de descarga.
        - name: media
          mountPath: /data
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: prowlarr
  ports:
    - port: 80
      targetPort: 9696
      protocol: TCP