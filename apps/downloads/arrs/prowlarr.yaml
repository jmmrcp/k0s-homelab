apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app: prowlarr
spec:
  replicas: 1
  # CRÍTICO: Igual que en Sonarr/Radarr, usamos Recreate para proteger la DB SQLite.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        imagePullPolicy: IfNotPresent
        
        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 9696
          name: http

        # --- MONITORIZACIÓN MEJORADA (HTTP) ---
        livenessProbe:
          httpGet:
            path: /ping
            port: 9696
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /ping
            port: 9696
          initialDelaySeconds: 15
          periodSeconds: 10

        # StartupProbe para dar margen en actualizaciones
        startupProbe:
          httpGet:
            path: /ping
            port: 9696
          failureThreshold: 30
          periodSeconds: 10

        # --- OPTIMIZACIÓN DE RECURSOS ---
        # Prowlarr es muy eficiente. 300Mi es un techo seguro.
        resources:
          requests:
            cpu: 10m
            memory: 100Mi 
          limits:
            cpu: 500m
            memory: 300Mi # Bajado de 512Mi. Ahorras ~200MB de reserva.

        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: prowlarr
  ports:
    - port: 80
      targetPort: 9696
      protocol: TCP
