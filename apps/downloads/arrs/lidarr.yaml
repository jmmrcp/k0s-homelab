apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: downloads
  labels:
    app: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      containers:
      - name: lidarr
        image: lscr.io/linuxserver/lidarr:latest
        
        # --- SEGURIDAD CONTENEDOR ---
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        # --- ENTORNO ---
        envFrom:
        - configMapRef:
            name: common-env # Carga PUID, PGID y TZ

        # --- PUERTOS ---
        ports:
        - containerPort: 8686
          name: http

        # --- CONTROL DE SALUD ---
        livenessProbe:
          tcpSocket:
            port: 8686
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8686
          initialDelaySeconds: 15
          periodSeconds: 10

        # --- RECURSOS ---
        # Lidarr consume RAM al escanear bibliotecas con muchas canciones
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi 

        # --- DISCOS ---
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data # Vital para hardlinks con qBittorrent
        - name: temp-run
          mountPath: /run  # <--- NUEVO: Soluciona el error de s6-overlay
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: lidarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
      - name: temp-run     # <--- NUEVO: Disco temporal en RAM/Disco
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr-lb # Mantenemos el nombre para no romper Ingress
  namespace: downloads
spec:
  type: ClusterIP # Solo accesible internamente
  selector:
    app: lidarr
  ports:
    - port: 80
      targetPort: 8686
      protocol: TCP