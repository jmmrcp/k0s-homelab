apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: downloads
  labels:
    app: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      # SIN securityContext a nivel de Pod (para evitar error s6-overlay)

      containers:
      - name: lidarr
        image: lscr.io/linuxserver/lidarr:latest
        
        # SIN securityContext a nivel de Contenedor

        # Carga PUID=1000, PGID=1000, TZ desde tu configuración común
        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 8686
          name: http

        # Control de salud para reiniciar si se cuelga
        livenessProbe:
          tcpSocket:
            port: 8686
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8686
          initialDelaySeconds: 15
          periodSeconds: 10

        # Límites de recursos (Lidarr consume RAM al escanear música)
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data # Vital para Hardlinks con qBittorrent
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: lidarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr-lb
  namespace: downloads
spec:
  type: ClusterIP # Solo interno
  selector:
    app: lidarr
  ports:
    - port: 80
      targetPort: 8686
      protocol: TCP