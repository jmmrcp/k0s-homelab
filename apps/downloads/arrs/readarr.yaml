apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: downloads
  labels:
    app: readarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr
  template:
    metadata:
      labels:
        app: readarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: readarr
        image: lscr.io/linuxserver/readarr:develop
        envFrom:
        - configMapRef:
            name: common-env
        ports:
        - containerPort: 8787
        livenessProbe:
          tcpSocket:
            port: 8787
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /data
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: readarr-config
      - name: downloads
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: readarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: readarr
  ports:
    - port: 80
      targetPort: 8787