apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: downloads
  labels:
    app: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true

      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest
        imagePullPolicy: Always  # Recomendado para tag :latest

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 6767
          name: http

        # Mejora: HTTPGet en path raíz (Bazarr responde OK en /)
        livenessProbe:
          httpGet:
            path: /
            port: 6767
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 6767
          initialDelaySeconds: 30
          periodSeconds: 10

        resources:
          requests:
            cpu: 10m
            memory: 256Mi  # Aumentado ligeramente para mayor margen
          limits:
            cpu: 1000m     # Aumentado para picos de análisis
            memory: 2Gi

        volumeMounts:
        - name: config
          mountPath: /config
        # Opción recomendada: montajes separados (ajustar subPath si es necesario)
        - name: media
          mountPath: /movies
          subPath: movies  # Ajustar según estructura real en qbit-downloads
        - name: media
          mountPath: /tv
          subPath: tv      # Ajustar según estructura real en qbit-downloads
        # Alternativa: mantener /data si prefieres configuración única
        # - name: media
        #   mountPath: /data

      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: bazarr
  ports:
    - port: 80
      targetPort: 6767
      protocol: TCP