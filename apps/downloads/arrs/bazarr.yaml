apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: downloads
  labels:
    app: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      # --- BORRADO: securityContext nivel pod (runAsUser, etc) ---
      
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest
        
        # --- BORRADO: securityContext nivel container (capabilities) ---

        envFrom:
        - configMapRef:
            name: common-env # Esto ya le dice que use el usuario 1000 (PUID)

        ports:
        - containerPort: 6767
          name: http

        livenessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 15
          periodSeconds: 10

        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi 

        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data
        # --- BORRADO: volumen temp /run ---
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
      # --- BORRADO: volumen temp emptyDir ---
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: bazarr
  ports:
    - port: 80
      targetPort: 6767
      protocol: TCP