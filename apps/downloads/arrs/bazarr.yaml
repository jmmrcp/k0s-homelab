apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: downloads
  labels:
    app: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
# --- BLOQUE DE SEGURIDAD CORREGIDO ---
      securityContext:
        runAsUser: 1000      # Usuario 1000
        runAsGroup: 1000     # Grupo 1000
        fsGroup: 1000        # ¡CRUCIAL! Hace que los volúmenes sean del grupo 1000
        runAsNonRoot: true   # Seguridad extra: prohibido ser root
      # -------------------------------------
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest
        
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        envFrom:
        - configMapRef:
            name: common-env

        ports:
        - containerPort: 6767
          name: http

        livenessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 15
          periodSeconds: 10

        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi 

        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data
        # 👇 ESTO ES LO QUE ARREGLA EL ERROR 👇
        - name: temp
          mountPath: /run
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
      # 👇 VOLUMEN TEMPORAL NECESARIO 👇
      - name: temp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-lb
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: bazarr
  ports:
    - port: 80
      targetPort: 6767
      protocol: TCP