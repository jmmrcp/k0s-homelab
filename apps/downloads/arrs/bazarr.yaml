apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: downloads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: downloads
  labels:
    app: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      # --- SEGURIDAD POD ---
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true

      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest
        
        # --- SEGURIDAD CONTENEDOR ---
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        # --- ENTORNO ---
        envFrom:
        - configMapRef:
            name: common-env # Carga PUID, PGID y TZ

        # --- PUERTOS ---
        ports:
        - containerPort: 6767
          name: http

        # --- CONTROL DE SALUD ---
        livenessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 15
          periodSeconds: 10

        # --- RECURSOS ---
        # Bazarr (Python) puede tener picos al analizar bibliotecas grandes
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi 

        # --- DISCOS ---
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data # Vital para que encuentre los archivos de video
          
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: media
        persistentVolumeClaim:
          claimName: qbit-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-lb # Mantenemos nombre para Ingress
  namespace: downloads
spec:
  type: ClusterIP # Solo accesible internamente
  selector:
    app: bazarr
  ports:
    - port: 80
      targetPort: 6767
      protocol: TCP