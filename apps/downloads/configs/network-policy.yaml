# 2. ACCESO EXTERNO
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-access
  namespace: downloads
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # --- BLOQUE NUEVO PARA TAILSCALE Y LAN ---
  - from:
    - ipBlock:
        cidr: 100.64.0.0/10       # Rango oficial de Tailscale
    - ipBlock:
        cidr: 192.168.18.0/24     # Tu Red Local (permite acceso directo por IP)
  # Permitir tráfico desde el Ingress Controller (.lan / HTTPS)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8096
    - protocol: TCP
      port: 5055
    - protocol: TCP
      port: 7878
    - protocol: TCP
      port: 8989
    - protocol: TCP
      port: 8686
    - protocol: TCP
      port: 8787
    - protocol: TCP
      port: 9696
    - protocol: TCP
      port: 6767
  # Cloudflare Tunnel
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare
      podSelector:
        matchLabels:
          app: cloudflared
  # Monitorización
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
---
# 3. TRÁFICO LATERAL (Conexiones entre aplicaciones)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-app
  namespace: downloads
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  
  # A. Permitir entrar a qBittorrent (desde los Arrs)
  - from:
    - podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [radarr, sonarr, lidarr, readarr, prowlarr, jellyseerr]
    ports:
    - protocol: TCP
      port: 8080 

  # B. Permitir entrar a FlareSolverr (desde Prowlarr)
  - from:
    - podSelector:
        matchLabels:
          app: prowlarr
    ports:
    - protocol: TCP
      port: 8191

  # C. Permitir entrar a los Arrs y Prowlarr
  # AQUÍ ESTABA EL ERROR: Faltaban radarr y sonarr en la lista de origen
  - from:
    - podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [jellyseerr, bazarr, prowlarr, radarr, sonarr, lidarr, readarr]
    ports:
    - protocol: TCP
      port: 7878 # Radarr
    - protocol: TCP
      port: 8989 # Sonarr
    - protocol: TCP
      port: 8686 # Lidarr
    - protocol: TCP
      port: 8787 # Readarr
    - protocol: TCP
      port: 9696 # Prowlarr

  # D. Permitir entrar a Jellyfin
  - from:
    - podSelector:
        matchLabels:
          app: jellyseerr
    ports:
    - protocol: TCP
      port: 8096
