apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-master
  namespace: node-feature-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfd-master
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - topology.node.k8s.io
  resources:
  - noderesourcetopologies
  verbs:
  - create
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nfd-master
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfd-master
subjects:
- kind: ServiceAccount
  name: nfd-master
  namespace: node-feature-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nfd-master
  name: nfd-master
  namespace: node-feature-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfd-master
  template:
    metadata:
      labels:
        app: nfd-master
    spec:
      serviceAccountName: nfd-master
      containers:
      - args:
        - -c
        - /etc/kubernetes/node-feature-discovery/nfd-master.conf
        image: registry.k8s.io/nfd/node-feature-discovery:v0.16.6
        name: nfd-master
        command:
        - nfd-master
        # --- BLOQUE AÑADIDO ---
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            memory: "512Mi"  # Esto asegura que no reserve 4GB
        # ----------------------
        volumeMounts:
        - mountPath: /etc/kubernetes/node-feature-discovery/
          name: nfd-master-conf
          readOnly: true
      volumes:
      - configMap:
          items:
          - key: nfd-master.conf
            path: nfd-master.conf
          name: nfd-master-conf
        name: nfd-master-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfd-master-conf
  namespace: node-feature-discovery
data:
  nfd-master.conf: |
    # Configuración por defecto
---
apiVersion: v1
kind: Service
metadata:
  name: nfd-master
  namespace: node-feature-discovery
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: nfd-master
  type: ClusterIP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: nfd-worker
  name: nfd-worker
  namespace: node-feature-discovery
spec:
  selector:
    matchLabels:
      app: nfd-worker
  template:
    metadata:
      labels:
        app: nfd-worker
    spec:
      containers:
      - args:
        - -server
        - nfd-master:8080
        command:
        - nfd-worker
        image: registry.k8s.io/nfd/node-feature-discovery:v0.16.6
        name: nfd-worker
        # --- BLOQUE AÑADIDO ---
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            memory: "256Mi"
        # ----------------------
        volumeMounts:
        - mountPath: /host-sys/
          name: host-sys
          readOnly: true
        - mountPath: /etc/kubernetes/node-feature-discovery/
          name: nfd-worker-conf
          readOnly: true
      volumes:
      - hostPath:
          path: /sys
        name: host-sys
      - configMap:
          items:
          - key: nfd-worker.conf
            path: nfd-worker.conf
          name: nfd-worker-conf
        name: nfd-worker-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfd-worker-conf
  namespace: node-feature-discovery
data:
  nfd-worker.conf: |
    core:
      labelSources: [all]
      sources:
        pci:
          deviceClassWhitelist:
            - "03" # Gráficos (Para detectar tu Intel GPU)
            - "02" # Red
        usb:
          deviceClassWhitelist:
            - "0e"
            - "ef"
            - "fe"
            - "ff"
---
# --- GARBAGE COLLECTOR (Limpia etiquetas viejas) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfd-gc
  namespace: node-feature-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfd-gc
  template:
    metadata:
      labels:
        app: nfd-gc
    spec:
      serviceAccountName: nfd-master
      containers:
      - command:
        - nfd-gc
        image: registry.k8s.io/nfd/node-feature-discovery:v0.16.6
        name: nfd-gc
        # --- BLOQUE AÑADIDO ---
        resources:
          requests:
            cpu: "5m"
            memory: "10Mi"
          limits:
            memory: "64Mi"
        # ---------------------
