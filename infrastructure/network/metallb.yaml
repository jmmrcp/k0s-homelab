apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
  # Rango de IPs que MetalLB puede repartir.
  # Ajustado a tu red 192.168.18.x
  - 192.168.18.200-192.168.18.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advert
  namespace: metallb-system
spec:
  ipAddressPools:
  - first-pool
  # En modo L2, no necesitamos selectores complejos para una red doméstica.
  # Esto anuncia las IPs por ARP en todos los nodos.